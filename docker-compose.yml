# OMEGA · Pre-Cog Syndicate — one local stack
#
#   timescale    memory core: 1-min candles (hypertable) + anomaly detection in SQL
#   db-migrate   one-shot on every `up`: applies any db/init script an older volume has not seen yet
#   postgrest    read-only API over the api.* views
#   n8n          every minute: Binance klines → Timescale → pulse/anomaly → relay + Telegram
#                every 10 min: free RSS news + Fear & Greed → Timescale → scored by cortex → relay + Telegram
#   relay        authenticated inbox, SSE fan-out, /api proxy, serves the Neural Constellation
#   cortex       LLM gateway: Claude + free tiers behind one OpenAI-compatible endpoint, failover,
#                every call's latency/tokens/outcome remembered in Timescale
#   ollama       open-source local LLM (MIT): the free, quota-less last link of every Cortex chain
#   workstation  Giant Core Streamlit app   (optional: --profile workstation)
#
# Everything published binds to 127.0.0.1. Only n8n, cortex and ollama (model pulls) can reach the internet.
#   Dashboard  http://localhost:8088      n8n editor  http://localhost:5678
#   Cortex     http://localhost:8089/v1   (OpenAI-compatible, Bearer OMEGA_GATEWAY_TOKEN)
#   Workstation http://localhost:8501     (with --profile workstation)

name: omega

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "3" }

x-n8n-env: &n8n-env
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
  OMEGA_RELAY_TOKEN: ${OMEGA_RELAY_TOKEN:?set OMEGA_RELAY_TOKEN in .env}
  OMEGA_GATEWAY_TOKEN: ${OMEGA_GATEWAY_TOKEN:?set OMEGA_GATEWAY_TOKEN in .env}   # seeded as n8n's Cortex credential
  SENTINEL_DB_PASSWORD: ${SENTINEL_DB_PASSWORD:?set SENTINEL_DB_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-omega}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  GENERIC_TIMEZONE: ${TZ:-Asia/Kuwait}
  TZ: ${TZ:-Asia/Kuwait}
  N8N_HOST: localhost
  N8N_PORT: "5678"
  N8N_PROTOCOL: http
  N8N_LISTEN_ADDRESS: 0.0.0.0
  N8N_SECURE_COOKIE: "false"          # plain http on localhost
  # Lock-down
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.ssh","n8n-nodes-base.localFileTrigger","n8n-nodes-base.readWriteFile"]'
  N8N_RUNNERS_ENABLED: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_TEMPLATES_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_HIRING_BANNER_ENABLED: "false"
  # Housekeeping
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "168"

services:
  timescale:
    image: timescale/timescaledb:2.17.2-pg16
    <<: *hardening
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omega}
      POSTGRES_USER: omega_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SENTINEL_DB_PASSWORD: ${SENTINEL_DB_PASSWORD:?set SENTINEL_DB_PASSWORD in .env}
      PGRST_DB_PASSWORD: ${PGRST_DB_PASSWORD:?set PGRST_DB_PASSWORD in .env}
      TZ: UTC
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [db]
    shm_size: 256m
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omega_admin -d ${POSTGRES_DB:-omega}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Postgres runs db/init only when it creates an empty volume. This brings an existing volume up to
  # date: every script skips itself once its schema exists, so it is a no-op on a current stack.
  db-migrate:
    image: timescale/timescaledb:2.17.2-pg16
    <<: *hardening
    cap_drop: ["ALL"]
    restart: "no"
    user: postgres
    read_only: true
    depends_on:
      timescale: { condition: service_healthy }
    entrypoint: ["sh", "/db/migrate.sh"]
    environment:
      PGHOST: timescale
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-omega}
      POSTGRES_USER: omega_admin
      SENTINEL_DB_PASSWORD: ${SENTINEL_DB_PASSWORD:?set SENTINEL_DB_PASSWORD in .env}
      PGRST_DB_PASSWORD: ${PGRST_DB_PASSWORD:?set PGRST_DB_PASSWORD in .env}
    volumes:
      - ./db:/db:ro
    networks: [db]
    mem_limit: 128m

  postgrest:
    image: postgrest/postgrest:v12.2.3
    <<: *hardening
    cap_drop: ["ALL"]
    read_only: true
    depends_on:
      timescale: { condition: service_healthy }
      db-migrate: { condition: service_completed_successfully }
    environment:
      PGRST_DB_URI: postgres://authenticator:${PGRST_DB_PASSWORD}@timescale:5432/${POSTGRES_DB:-omega}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_DB_MAX_ROWS: "3000"
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_OPENAPI_MODE: disabled
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?set PGRST_JWT_SECRET in .env}   # only cortex signs with it
    networks: [db, core]
    mem_limit: 128m

  n8n-init:
    image: n8nio/n8n:${N8N_VERSION:-1.80.0}
    <<: *hardening
    cap_drop: ["ALL"]
    restart: "no"
    environment: *n8n-env
    entrypoint: ["/bin/sh", "/seed/init.sh"]
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/seed:ro
    network_mode: none

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-1.80.0}
    <<: *hardening
    cap_drop: ["ALL"]
    depends_on:
      n8n-init: { condition: service_completed_successfully }
      db-migrate: { condition: service_completed_successfully }
      relay: { condition: service_healthy }
    environment: *n8n-env
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    networks: [egress, db, core]
    mem_limit: 1g
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  relay:
    image: node:22.12.0-alpine
    <<: *hardening
    cap_drop: ["ALL"]
    user: "node"
    read_only: true
    tmpfs: ["/tmp:size=8m"]
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      OMEGA_RELAY_TOKEN: ${OMEGA_RELAY_TOKEN:?set OMEGA_RELAY_TOKEN in .env}
      OMEGA_SYMBOLS: ${OMEGA_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT}
      N8N_HEALTH_URL: http://n8n:5678/healthz
      PGRST_URL: http://postgrest:3000
      PGRST_ADMIN_URL: http://postgrest:3001
      CORTEX_URL: http://cortex:8090
      OMEGA_GATEWAY_TOKEN: ${OMEGA_GATEWAY_TOKEN:?set OMEGA_GATEWAY_TOKEN in .env}
      TZ: ${TZ:-Asia/Kuwait}
    volumes:
      - ./relay:/app:ro
      - ./dashboard:/srv/dashboard:ro    # directory mounts survive editors that replace files
    ports:
      - "127.0.0.1:8088:8080"
    networks: [core, edge]
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3

  cortex:
    build: { context: ./gateway }
    image: omega-cortex:local
    <<: *hardening
    cap_drop: ["ALL"]
    read_only: true
    depends_on:
      postgrest: { condition: service_started }
    environment:
      OMEGA_GATEWAY_TOKEN: ${OMEGA_GATEWAY_TOKEN:?set OMEGA_GATEWAY_TOKEN in .env}
      PGRST_URL: http://postgrest:3000
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?set PGRST_JWT_SECRET in .env}
      OMEGA_PROVIDERS_FILE: /config/providers.json
      OMEGA_ALLOW_ANON_PROVIDERS: ${OMEGA_ALLOW_ANON_PROVIDERS:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-${MODEL_API_KEY:-}}   # MODEL_API_KEY works as an alias
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      CLAUDE_EFFORT: ${CLAUDE_EFFORT:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      LLM7_API_KEY: ${LLM7_API_KEY:-}
      OMEGA_LOCAL_LLM_URL: ${OMEGA_LOCAL_LLM_URL-http://ollama:11434/v1}   # set empty to switch the local model off
      OMEGA_LOCAL_MODEL: ${OMEGA_LOCAL_MODEL:-llama3.2:3b}
      TZ: ${TZ:-Asia/Kuwait}
    volumes:
      - ./gateway/config:/config:ro     # edit providers.json, then: docker compose kill -s HUP cortex
    ports:
      - "127.0.0.1:8089:8090"
    networks: [egress, core]
    mem_limit: 192m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3

  # Open-source LLM runtime. Pulls OMEGA_LOCAL_MODEL once into a volume; afterwards it runs offline.
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.34.4}
    <<: *hardening
    environment:
      OLLAMA_KEEP_ALIVE: 30m          # keep the model warm between calls
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NOPRUNE: "1"
    volumes:
      - ollama_models:/root/.ollama
    networks: [egress, core]          # egress only to pull models
    mem_limit: ${OLLAMA_MEM_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama-pull:
    image: ollama/ollama:${OLLAMA_VERSION:-0.34.4}
    restart: "no"
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OMEGA_LOCAL_MODEL:-llama3.2:3b}"]
    networks: [core]

  workstation:
    profiles: ["workstation"]
    build: { context: ., dockerfile: workstation.Dockerfile }
    <<: *hardening
    cap_drop: ["ALL"]
    volumes:
      - workstation_plugins:/app/plugins
    ports:
      - "127.0.0.1:8501:8501"
    networks: [edge]
    mem_limit: 512m

networks:
  db:       # timescale <-> postgrest, n8n. No internet.
    internal: true
  core:     # n8n, postgrest <-> relay. No internet.
    internal: true
  egress:   # the way out: n8n to Binance, news feeds + Telegram, cortex to the LLM providers
  edge:     # carries 127.0.0.1 port publishes

volumes:
  ollama_models:
  timescale_data:
  n8n_data:
  workstation_plugins:
