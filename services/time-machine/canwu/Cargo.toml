[package]
name = "canwu"
version = "0.1.0"
edition = "2021"
authors = ["OMEGA PRIME Team"]
description = "High-throughput Rust-based event processing and orchestration engine for the Time Machine simulation pipeline."
license = "MIT"
repository = "https://github.com/ahmed974x/giant-core"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Redis
redis = { version = "0.25", features = ["aio", "tokio-comp", "json"] }
redis-stream-utils = "0.1"

# HTTP & Web
axum = "0.7"
hyper = "1.1"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "json", "uuid", "chrono"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "1.0"
anyhow = "1.0"
eyre = "0.6"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
once_cell = "1.19"

# Performance monitoring
metrics = "0.21"
metrics-exporter-prometheus = "0.13"

# Validation
validator = "0.16"

# Concurrent collections
dashmap = "5.5"

# Testing dependencies
[dev-dependencies]
cargo-watch = "8.4"
mockito = "1.2"
tokio-test = "0.4"

[[bin]]
name = "canwu"
path = "src/main.rs"

[[bin]]
name = "canwu-cli"
path = "src/cli.rs"
required-features = ["cli"]

[features]
default = []
cli = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
