name: omega-sentinel

on:
  pull_request:
    paths: ["mcp/omega-sentinel/**", ".github/workflows/omega-sentinel.yml"]
  push:
    branches: [main]
    paths: ["mcp/omega-sentinel/**", ".github/workflows/omega-sentinel.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/omega-sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/omega-sentinel/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: omega-sentinel-mcpb
          path: mcp/omega-sentinel/dist/omega-sentinel.mcpb
          if-no-files-found: error
