name: deploy-pages

# Publishes NABD, the Ops Room and THE CHAIN to https://ahmed974x.github.io/giant-core/ (ADR-098, ADR-099).
# Runs on main (after a PR is merged), by hand, and every hour at :15 to refresh the public intel snapshot
# (ADR-104), and only after the whole-repo SkillSpector scan and a scan of the built site pass.
# The site is static: paper only, no keys, no server, no orders.
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SkillSpector strict scan of the whole repo (critical or high stops the deploy)
        run: node scripts/skillspector-audit.mjs --strict .
      - name: Fetch the public intel snapshot (NGA, GDACS, USGS, Open-Meteo, Binance, Digitraffic, CelesTrak, EONET, SWPC, CISA KEV, RIPEstat, IODA, Deribit; keyless)
        run: node scripts/fetch-public-intel-snapshot.mjs data/public-intel-snapshot.json --prev https://ahmed974x.github.io/giant-core/data/public-intel-snapshot.json || echo "No source answered; publishing without a snapshot"
      - name: Assemble the public site from the allowlist (refuses e-mail addresses, key-shaped strings, secret file names)
        run: node scripts/build-pages.mjs _site
      - name: SkillSpector strict scan of the built site
        run: node scripts/skillspector-audit.mjs --strict _site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          include-hidden-files: true

  # The repository's Pages source is the gh-pages branch (ADR-071), so the deploy is a plain commit of the
  # built site to that branch, with no third-party action. Only this job may write.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Commit the built site to gh-pages
        run: |
          cd gh-pages
          git rm -rq --ignore-unmatch .
          cp -a ../_site/. .
          git add -A
          if git diff --cached --quiet; then echo "Site unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Publish site from main ${GITHUB_SHA::7} (ADR-099)"
          git push origin gh-pages
