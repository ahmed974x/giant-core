name: skillspector

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Brain 2 maths tests and the Ops Room inline copy (ADR-108)
        run: node scripts/test-brain2.mjs
      - name: Deep research engine tests and the ORACLE inline copy (ADR-114)
        run: node scripts/test-research.mjs
      - name: Trade lab engine tests, the TRADE LAB inline copy and the proxy API document (ADR-116)
        run: node scripts/test-tradelab.mjs
      - name: Second brain engine, Arabic / English engine and dictionaries, and their inline copies (ADR-119)
        run: node scripts/test-brain.mjs
      - name: Core engine tests (planner, retries, breaker, memory, lessons, missions, 3D maths) and its inline copies (ADR-121)
        run: node scripts/test-core.mjs
      - name: Knowledge domain tests (graph, PageRank, bridges, missing links, gaps, ask, plan review, enrichment shapes) and its inline copies (ADR-126)
        run: node scripts/test-knowledge.mjs
      - name: APEX council tests (field helpers, routing, plans through checkPlan, inboxes, network, dark gold tone on every page) and its inline copy (ADR-127)
        run: node scripts/test-apex.mjs
      - name: Static page checks, CSS braces, Arabic faces, self-test badge (ADR-120)
        run: node scripts/test-pages.mjs
      - name: Self-shield, OMEGA attacks its own proxy in an offline sandbox and lints its pages and files (ADR-122)
        run: node scripts/test-self-shield.mjs
      - name: SkillSpector strict scan of the whole repo (critical or high fails the job)
        run: node scripts/skillspector-audit.mjs --strict --json skillspector-report.json .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skillspector-report
          path: skillspector-report.json
          if-no-files-found: ignore
