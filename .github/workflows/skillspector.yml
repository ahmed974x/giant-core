name: skillspector

on:
  pull_request:
    paths:
      - "site-landing/**"
      - "omega-ops-room-v1/**"
      - "scripts/**"
      - ".claude/skills/omega-*/**"
      - ".skillspector.json"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "DESIGN.md"
      - ".github/workflows/skillspector.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SkillSpector strict scan (critical or high fails the job)
        run: node scripts/skillspector-audit.mjs --strict --json skillspector-report.json site-landing omega-ops-room-v1 scripts .claude/skills/omega-design .claude/skills/omega-finance-chain AGENTS.md CLAUDE.md DESIGN.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skillspector-report
          path: skillspector-report.json
          if-no-files-found: ignore
