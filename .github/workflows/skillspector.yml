name: skillspector

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SkillSpector strict scan of the whole repo (critical or high fails the job)
        run: node scripts/skillspector-audit.mjs --strict --json skillspector-report.json .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skillspector-report
          path: skillspector-report.json
          if-no-files-found: ignore
