version: "3.9"

services:
  quantreplay:
    image: quay.io/quodfinancial/quantreplay:latest
    container_name: omega-quantreplay
    ports:
      - "8080:8080"
    environment:
      - QUANTREPLAY_PORT=8080
      - QUANTREPLAY_ENV=development
      - QUANTREPLAY_LOG_LEVEL=info
    restart: unless-stopped

  canwu:
    build:
      context: ./services/time-machine
      dockerfile: Dockerfile.canwu
    container_name: omega-canwu
    environment:
      - RUST_LOG=info
      - CANWU_PORT=8081
    restart: unless-stopped
