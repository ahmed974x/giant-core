:root:lang(ar), :lang(ar) {
  --text-caption: 12px;

@media (prefers-reduced-transparency: reduce) {
  :root, :root[data-theme="light"], :root[data-theme="dark"] {
    --color-glass: var(--color-surface-raised); --glass-blur: 0px; --glass-saturate: 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  :root { --motion-fast: 0ms; --motion-base: 0ms; --motion-slow: 0ms; }
}
/* Jarvis app styles (ADR-133). Tokens only: every colour, size, radius and duration is a var(--…)
   from jarvis/replica/design/tokens.css. Motion animates transform and opacity only. */
:root { --sb: var(--layout-sidebar); --hairline: 1px; --stage-h: 640px; }
@media (min-resolution: 2dppx) { :root { --hairline: 0.5px; } }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100dvh; background: var(--color-bg); color: var(--color-text);
  font: var(--text-base--font-weight) var(--text-base)/var(--text-base--line-height) var(--font-sans);
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
:lang(ar) body, body:lang(ar) { font-family: var(--font-arabic); letter-spacing: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--color-accent); }
.mono, code, kbd, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums slashed-zero; }
.num { direction: ltr; unicode-bidi: isolate; }
.vh { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; inset-inline-start: 8px; inset-block-start: -48px; z-index: 80; padding: 8px 12px; border-radius: var(--radius-sm); background: var(--color-accent); color: var(--color-on-accent); text-decoration: none; font-weight: 600; }
.skip:focus { inset-block-start: 8px; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 16px; height: 16px; }
/* English UI text inside an RTL shell: each label takes its direction from its own first letter,
   so trailing "…" and ":" stay where English readers expect them (DESIGN.md §2, bidi isolation). */
[dir="rtl"] :is(.btn, .tab, .seg button, label, .legend, .badge, .hint, .err, .lede, .sample-note, .stat .label, th, td, .feed li, .blk-head .name, .checks li, summary) { unicode-bidi: plaintext; }
.muted { color: var(--color-text-muted); }
.subtle { color: var(--color-text-subtle); }
.t-caption { font-size: var(--text-caption); line-height: var(--text-caption--line-height); }
.t-sm { font-size: var(--text-sm); line-height: var(--text-sm--line-height); }

/* Liquid Glass: only on sticky or floating chrome (DESIGN.md §4). Solid where blur is missing
   or the person asks for less transparency (the token itself turns solid then). */
.glass {
  background: var(--color-surface-raised);
  box-shadow: inset 0 1px 0 var(--color-glass-rim), 0 0 0 var(--hairline) var(--color-glass-edge);
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass {
    background: var(--color-glass);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  }
}

/* ── Shell ─────────────────────────────────────────────── */
.app { display: grid; grid-template-columns: var(--sb) minmax(0, 1fr); min-height: 100dvh; }
.app.rail { --sb: var(--layout-sidebar-rail); }
.sidebar {
  position: sticky; inset-block-start: 0; height: 100dvh; display: flex; flex-direction: column; gap: 8px;
  padding: 12px 8px calc(12px + env(safe-area-inset-bottom)); overflow-y: auto; overflow-x: hidden;
  border-inline-end: var(--hairline) solid var(--color-border); z-index: 30;
}
.brand { display: flex; align-items: center; gap: 10px; min-height: 40px; padding-inline: 8px; font-weight: 700; font-size: var(--text-headline); }
.brand svg { width: 24px; height: 24px; flex: none; color: var(--color-accent); }
.nav { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav a {
  position: relative; display: flex; align-items: center; gap: 12px; min-height: 36px; padding-inline: 10px;
  border-radius: var(--radius-sm); color: var(--color-text-muted); text-decoration: none;
  font-size: var(--text-sm); font-weight: 500; white-space: nowrap;
}
.nav a:hover { background: var(--color-surface-raised); color: var(--color-text); }
.nav a[aria-current="page"] { color: var(--color-accent); background: var(--color-surface-raised); }
.nav a[aria-current="page"]::before { content: ""; position: absolute; inset-inline-start: -8px; inset-block: 8px; width: 2px; border-radius: 2px; background: var(--color-accent); }
.nav .count { margin-inline-start: auto; min-width: 22px; padding-inline: 6px; border-radius: var(--radius-pill); background: var(--color-surface-sunken); color: var(--color-approval); font-size: var(--text-caption); line-height: 20px; text-align: center; }
.nav-label { overflow: hidden; text-overflow: ellipsis; }
.nav-group { margin: 12px 10px 4px; color: var(--color-text-subtle); font-size: var(--text-caption); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; }
.sidebar-foot { margin-block-start: auto; display: grid; gap: 2px; }
.app.rail .nav-label, .app.rail .nav-group, .app.rail .brand-word, .app.rail .nav .count { display: none; }
.app.rail .nav a, .app.rail .sidebar .collapse-btn { justify-content: center; padding: 0; }
.app.rail .collapse-btn svg { transform: scaleX(-1); }
[dir="rtl"] .collapse-btn svg { transform: scaleX(-1); }
[dir="rtl"] .app.rail .collapse-btn svg { transform: none; }
.sidebar .collapse-btn { justify-content: flex-start; padding-inline: 10px; }
.scrim { position: fixed; inset: 0; z-index: 35; background: rgb(0 0 0 / 0.5); }

.main-col { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; inset-block-start: 0; z-index: 20; display: flex; align-items: center; gap: 8px;
  min-height: var(--layout-header); padding-inline: 16px; padding-block-start: env(safe-area-inset-top);
  border-block-end: var(--hairline) solid var(--color-border);
}
.topbar .spacer { flex: 1; }
.topbar .menu-btn { display: none; }
.topbar .search-trigger { min-width: 0; flex: 0 1 320px; justify-content: space-between; color: var(--color-text-subtle); font-weight: 500; }
.kbd { font-family: var(--font-mono); font-size: var(--text-caption); padding-inline: 6px; border: var(--hairline) solid var(--color-border); border-radius: var(--radius-xs); color: var(--color-text-muted); }
.ws { position: relative; min-width: 0; }
.ws-menu { position: absolute; z-index: 25; inset-inline-start: 0; inset-block-start: calc(100% + 6px); min-width: 240px; padding: 6px; margin: 0; list-style: none; border-radius: var(--radius-lg); box-shadow: var(--shadow-pop), inset 0 1px 0 var(--color-glass-rim), 0 0 0 var(--hairline) var(--color-glass-edge); }
.ws-menu [role="menuitemradio"] { display: flex; align-items: center; gap: 8px; min-height: 40px; padding-inline: 10px; border-radius: var(--radius-md); cursor: pointer; font-size: var(--text-sm); }
.ws-menu [role="menuitemradio"]:hover, .ws-menu [role="menuitemradio"]:focus { background: var(--color-surface-sunken); outline: none; }
.ws-menu [role="menuitemradio"]:focus-visible { outline: 2px solid var(--color-focus); outline-offset: -2px; }
.ws-menu [aria-checked="true"]::after { content: "✓"; margin-inline-start: auto; color: var(--color-accent); }
.sample-note.live-note { color: var(--color-success); }
.skill-pick { display: grid; gap: 6px; max-height: 180px; overflow-y: auto; padding: 8px; border-radius: var(--radius-sm); background: var(--color-surface-sunken); border: 1px solid var(--color-border); }
.skill-pick label[hidden] { display: none; }
.locked-perm { color: var(--color-text-muted); }
.locked-perm svg { color: var(--color-approval); }
.clone-bar { display: grid; gap: 12px; }
.ds-line { list-style: none; margin: 0; padding: 0; gap: 6px; }
.clone-row { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr) auto; align-items: end; }
.report { display: grid; gap: 6px; font-size: var(--text-sm); }
.report dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0; }
.report dt { color: var(--color-text-muted); }
.report dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.report .badge { white-space: normal; height: auto; min-height: 24px; padding-block: 2px; }
.ws-name { font-weight: 600; font-size: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }

main { width: 100%; max-width: var(--layout-content-max); margin-inline: auto; padding: 24px 24px calc(48px + env(safe-area-inset-bottom)); display: grid; gap: 24px; align-content: start; }
main:focus { outline: none; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.page-head h1 { font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: var(--text-title--font-weight); }
.page-head .lede { margin-block-start: 4px; color: var(--color-text-muted); }
.sample-note { display: inline-flex; align-items: center; gap: 8px; width: fit-content; max-width: 100%; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--color-surface); border: var(--hairline) solid var(--color-border); color: var(--color-warning); font-size: var(--text-caption); font-weight: 500; }
section.block { display: grid; gap: 12px; }
section.block > h2, .h2 { font-size: var(--text-headline); line-height: var(--text-headline--line-height); font-weight: 600; }
.card { background: var(--color-surface); border: var(--hairline) solid var(--color-border); border-radius: var(--radius-lg); padding: 8px; box-shadow: var(--shadow-card); }
.card-in { padding: 12px; border-radius: var(--radius-md); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.stack { display: grid; gap: 12px; }
.grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }

/* ── Primitives ─────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding-inline: 14px;
  border-radius: var(--radius-sm); border: var(--hairline) solid transparent; cursor: pointer; background: none;
  font-size: var(--text-sm); font-weight: 600; white-space: nowrap; text-decoration: none; color: var(--color-text);
  transition: transform var(--motion-fast) var(--motion-ease), opacity var(--motion-fast) var(--motion-ease);
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-on-accent); }
.btn-primary:hover:not(:disabled) { background: var(--color-accent-hover); }
.btn-secondary { background: var(--color-surface-raised); border-color: var(--color-border); }
.btn-secondary:hover:not(:disabled) { border-color: var(--color-border-input); }
.btn-ghost { color: var(--color-text-muted); }
.btn-ghost:hover:not(:disabled) { background: var(--color-surface-raised); color: var(--color-text); }
.btn-danger { background: var(--color-danger); color: var(--color-on-danger); }
.btn-sm { min-height: 32px; padding-inline: 10px; }
.btn-icon { width: 36px; padding: 0; }
.btn-icon.btn-sm { width: 32px; }
.btn[aria-busy="true"] { cursor: progress; }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-inline-end-color: transparent; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .legend { font-size: var(--text-sm); font-weight: 500; }
.hint { font-size: var(--text-caption); color: var(--color-text-subtle); }
.err { display: flex; align-items: center; gap: 6px; font-size: var(--text-caption); color: var(--color-danger); }
.input, .select, .textarea {
  width: 100%; min-height: 36px; padding-inline: 12px; border-radius: var(--radius-sm);
  background: var(--color-surface-sunken); border: 1px solid var(--color-border-input); color: var(--color-text);
}
.textarea { padding-block: 8px; min-height: 96px; resize: vertical; }
.textarea.code { font-family: var(--font-mono); font-size: var(--text-sm); min-height: 220px; direction: ltr; text-align: left; }
.input::placeholder, .textarea::placeholder { color: var(--color-text-subtle); opacity: 1; }
.input:focus-visible, .select:focus-visible, .textarea:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 1px; border-color: var(--color-focus); }
.input[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--color-danger); }
.input:disabled { opacity: 0.5; }
fieldset { margin: 0; padding: 0; border: 0; display: grid; gap: 10px; min-width: 0; }
.check { display: flex; align-items: center; gap: 10px; font-size: var(--text-sm); cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--color-accent); }
.switch { appearance: none; -webkit-appearance: none; position: relative; flex: none; width: 36px; height: 20px; margin: 0; border-radius: var(--radius-pill); background: var(--color-surface-sunken); border: 1px solid var(--color-border-input); cursor: pointer; }
.switch::after { content: ""; position: absolute; inset-block-start: 2px; inset-inline-start: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--color-text-muted); transition: transform var(--motion-base) var(--motion-ease); }
.switch:checked { background: var(--color-accent); border-color: var(--color-accent); }
.switch:checked::after { transform: translateX(16px); background: var(--color-on-accent); }
[dir="rtl"] .switch:checked::after { transform: translateX(-16px); }
.color-row { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; align-items: center; }
.color-row input[type="color"] { width: 40px; height: 36px; padding: 2px; border: 1px solid var(--color-border-input); border-radius: var(--radius-sm); background: var(--color-surface-sunken); cursor: pointer; }

.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; border-radius: var(--radius-sm); background: var(--color-surface-sunken); border: var(--hairline) solid var(--color-border); }
.seg button { min-height: 32px; padding-inline: 12px; border: 0; border-radius: var(--radius-xs); background: none; color: var(--color-text-muted); font-size: var(--text-sm); font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--color-surface-raised); color: var(--color-text); box-shadow: inset 0 0 0 var(--hairline) var(--color-border); }

.tablist { display: flex; gap: 4px; border-block-end: var(--hairline) solid var(--color-border); overflow-x: auto; scrollbar-width: none; }
.tab { position: relative; min-height: 40px; padding-inline: 12px; border: 0; background: none; color: var(--color-text-muted); cursor: pointer; font-size: var(--text-sm); font-weight: 500; white-space: nowrap; }
.tab:hover, .tab[aria-selected="true"] { color: var(--color-text); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; inset-inline: 8px; inset-block-end: -1px; height: 2px; border-radius: 2px; background: var(--color-accent); }
.tabpanel { padding-block-start: 12px; }

.badge { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding-inline: 10px; border-radius: var(--radius-pill); background: var(--color-surface-sunken); border: var(--hairline) solid var(--color-border); font-size: var(--text-caption); font-weight: 500; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.s-idle { color: var(--color-text-subtle); }
.s-running, .s-ok, .s-succeeded { color: var(--color-success); }
.s-failed { color: var(--color-danger); }
.s-queued, .s-info { color: var(--color-info); }
.s-retry, .s-warn { color: var(--color-warning); }
.s-approval, .s-pending { color: var(--color-approval); }
.s-paused, .s-cancelled, .s-rejected, .s-expired { color: var(--color-text-muted); }
.s-approved { color: var(--color-success); }
.s-running .dot { animation: pulse 1.6s var(--motion-ease) infinite; }
@keyframes pulse { 50% { opacity: 0.4; } }

.stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.stat { display: grid; gap: 4px; padding: 16px; border-radius: var(--radius-md); background: var(--color-surface); border: var(--hairline) solid var(--color-border); text-decoration: none; color: inherit; }
a.stat:hover { border-color: var(--color-border-input); }
.stat .label { font-size: var(--text-caption); font-weight: 500; color: var(--color-text-muted); }
.stat .value { font-size: var(--text-display); line-height: var(--text-display--line-height); font-weight: 700; }

.table-scroll { overflow-x: auto; border-radius: var(--radius-md); border: var(--hairline) solid var(--color-border); background: var(--color-surface); }
table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
th, td { height: var(--layout-row); padding-inline: 12px; text-align: start; white-space: nowrap; border-block-end: var(--hairline) solid var(--color-border); }
th { font-size: var(--text-caption); font-weight: 500; color: var(--color-text-muted); }
tbody tr:hover { background: var(--color-surface-raised); }
tbody tr:last-child td { border-block-end: 0; }
td.end, th.end { text-align: end; }
td a { text-decoration: none; font-weight: 600; }
td a:hover { text-decoration: underline; }
.trunc { display: inline-block; max-width: 28ch; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.filters .field { flex: 1 1 200px; }
.filters .field.narrow { flex: 0 1 180px; }

.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.step { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-block-end: var(--hairline) solid var(--color-border); }
.step:last-child { border-block-end: 0; }
.step .idx { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--color-surface-sunken); font-size: var(--text-caption); }
.step .what { min-width: 0; display: grid; }
.step .what b { font-size: var(--text-sm); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step .what span { font-size: var(--text-caption); color: var(--color-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log { margin: 0; padding: 12px; min-height: 120px; border-radius: var(--radius-md); background: var(--color-surface-sunken); font-family: var(--font-mono); font-size: var(--text-caption); line-height: 20px; color: var(--color-text-muted); overflow-x: auto; white-space: pre; direction: ltr; text-align: left; }

.approval { display: grid; gap: 12px; align-content: start; padding: 16px; border-radius: var(--radius-md); background: var(--color-surface); border: var(--hairline) solid var(--color-border); }
.approval.locked { border: 1px dashed var(--color-approval); }
.approval h3 { font-size: var(--text-headline); font-weight: 600; overflow-wrap: anywhere; }
.diff { margin: 0; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--color-surface-sunken); font-family: var(--font-mono); font-size: var(--text-caption); line-height: 20px; white-space: pre-wrap; overflow-wrap: anywhere; direction: ltr; text-align: left; }
.lock-line { display: flex; align-items: center; gap: 8px; color: var(--color-approval); font-weight: 600; font-size: var(--text-sm); }

.empty { display: grid; justify-items: center; gap: 8px; padding: 32px 16px; text-align: center; border: 1px dashed var(--color-border); border-radius: var(--radius-md); }
.empty svg { width: 32px; height: 32px; color: var(--color-text-subtle); }
.empty h3 { font-size: var(--text-headline); font-weight: 600; }
.error-box { display: grid; gap: 8px; padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--color-danger); background: var(--color-surface); }
.error-box b { color: var(--color-danger); }
.skel { display: grid; gap: 10px; padding: 16px; border-radius: var(--radius-md); background: var(--color-surface); border: var(--hairline) solid var(--color-border); }
.sk { height: 12px; border-radius: 6px; background: var(--color-surface-raised); animation: shimmer 1.4s var(--motion-ease) infinite; }
.sk.w40 { width: 40%; } .sk.w60 { width: 60%; } .sk.w80 { width: 80%; }
@keyframes shimmer { 50% { opacity: 0.5; } }
.feed { list-style: none; margin: 0; padding: 0; display: grid; }
.feed li { display: flex; gap: 10px; align-items: baseline; padding: 10px 12px; border-block-end: var(--hairline) solid var(--color-border); font-size: var(--text-sm); }
.feed li:last-child { border-block-end: 0; }
.feed time { margin-inline-start: auto; flex: none; }

/* ── Dialogs, palette, toasts ───────────────────────────── */
dialog { width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 64px); padding: 0; border: 0; border-radius: var(--radius-lg); background: var(--color-surface-raised); color: var(--color-text); box-shadow: var(--shadow-pop), 0 0 0 var(--hairline) var(--color-border); }
dialog::backdrop { background: rgb(0 0 0 / 0.55); }
.dlg { display: grid; gap: 16px; padding: 20px; }
.dlg h2 { font-size: var(--text-headline); font-weight: 600; }
.dlg .actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
dialog.palette { margin-block-start: 12dvh; }
dialog.palette.glass { background: var(--color-surface-raised); }
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { dialog.palette.glass { background: var(--color-glass); } }
.pal-in { display: flex; align-items: center; gap: 10px; padding-inline: 16px; border-block-end: var(--hairline) solid var(--color-border); }
.pal-in svg { color: var(--color-text-subtle); }
.pal-in input { flex: 1; min-width: 0; height: 52px; border: 0; background: none; font-size: var(--text-headline); outline: none; }
.pal-in input::placeholder { color: var(--color-text-subtle); opacity: 1; }
.pal-list { list-style: none; margin: 0; padding: 6px; max-height: 50dvh; overflow-y: auto; }
.pal-list li { display: flex; align-items: center; gap: 10px; min-height: 40px; padding-inline: 10px; border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-sm); }
.pal-list li[aria-selected="true"] { background: var(--color-surface-sunken); color: var(--color-accent); }
.pal-list .kind { margin-inline-start: auto; color: var(--color-text-subtle); font-size: var(--text-caption); }
.pal-none { padding: 16px; color: var(--color-text-muted); font-size: var(--text-sm); }
.toasts { position: fixed; z-index: 70; inset-inline-end: 16px; inset-block-end: calc(16px + env(safe-area-inset-bottom)); display: grid; gap: 8px; width: min(360px, calc(100vw - 32px)); }
.toast { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: var(--radius-md); font-size: var(--text-sm); animation: toast-in var(--motion-base) var(--motion-ease); }
.toast .dot { margin-block-start: 6px; }
.toast p { flex: 1; min-width: 0; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

/* ── Studio (S13) ───────────────────────────────────────── */
.studio { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.studio-controls { display: grid; gap: 16px; align-content: start; }
.panel { display: grid; gap: 12px; padding: 16px; border-radius: var(--radius-lg); background: var(--color-surface); border: var(--hairline) solid var(--color-border); }
.panel h2 { font-size: var(--text-sm); font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
:lang(ar) .panel h2 { text-transform: none; letter-spacing: 0; }
.blocks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.blk { display: grid; gap: 8px; padding: 8px; border-radius: var(--radius-md); background: var(--color-surface-sunken); border: var(--hairline) solid var(--color-border); }
.blk-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.blk-head .name { flex: 1; min-width: 0; font-size: var(--text-sm); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blk-head .off { color: var(--color-text-subtle); font-weight: 500; }
.blk details summary { cursor: pointer; font-size: var(--text-caption); color: var(--color-text-muted); padding-block: 4px; }
.blk details[open] summary { margin-block-end: 8px; }
.cbadges { display: grid; gap: 6px; }
.cb { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--text-caption); }
.cb .badge { gap: 4px; }
.cb .pair { color: var(--color-text-muted); min-width: 0; flex: 1 1 120px; }
.preview-col { display: grid; gap: 8px; align-content: start; min-width: 0; }
.preview-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.stage { position: relative; height: var(--stage-h); overflow: hidden; border-radius: var(--radius-lg); background: var(--color-surface-sunken); border: var(--hairline) solid var(--color-border); direction: ltr; }
.stage iframe { position: absolute; inset-block-start: 0; left: 0; border: 0; background: var(--color-surface); transform-origin: 0 0; box-shadow: 0 0 0 var(--hairline) var(--color-border); }
@media (min-width: 1100px) {
  .studio { grid-template-columns: 360px minmax(0, 1fr); align-items: start; }
  .preview-col { position: sticky; inset-block-start: calc(var(--layout-header) + 16px); }
  :root { --stage-h: calc(100dvh - var(--layout-header) - 120px); }
}

/* ── Skill Mixer (S14) ──────────────────────────────────── */
.mixer { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .mixer { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: start; } .mix-side { position: sticky; inset-block-start: calc(var(--layout-header) + 16px); } }
.skills { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.skill { display: grid; gap: 8px; align-content: start; padding: 14px; border-radius: var(--radius-md); background: var(--color-surface); border: var(--hairline) solid var(--color-border); }
.skill.on { border-color: var(--color-accent); }
.skill-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.skill-head b { flex: 1; min-width: 0; font-size: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skill p { font-size: var(--text-caption); color: var(--color-text-muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.mixlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: mix; }
.mixlist li { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: var(--radius-sm); background: var(--color-surface-sunken); font-size: var(--text-sm); counter-increment: mix; }
.mixlist li.placeholder { counter-increment: none; }
.mixlist li.placeholder::before { content: none; }
.mixlist li::before { content: counter(mix); font-family: var(--font-mono); color: var(--color-text-subtle); min-width: 2ch; }
.mixlist li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.checks li { display: flex; gap: 8px; align-items: baseline; font-size: var(--text-sm); }
.checks li .mark { flex: none; font-weight: 700; }
.checks .pass .mark { color: var(--color-success); }
.checks .warn .mark { color: var(--color-warning); }
.checks .fail .mark { color: var(--color-danger); }

/* ── Mission Control (ADR-135) ──────────────────────────── */
.s-draft, .s-none { color: var(--color-text-subtle); }
.s-done, .s-pass { color: var(--color-success); }
.s-fail { color: var(--color-danger); }
.s-blocked, .s-awaiting_approval { color: var(--color-approval); }
.s-skipped { color: var(--color-text-muted); }
.between { justify-content: space-between; }
.tag-inf { font-family: var(--font-mono); color: var(--color-warning); }
.meter { block-size: 6px; border-radius: var(--radius-pill); background: var(--color-surface-sunken); overflow: hidden; }
.meter .bar { display: block; block-size: 100%; inline-size: 0; border-radius: inherit; background: currentColor; }
.health { display: grid; gap: 8px; }
.health b { font-size: var(--text-display); line-height: var(--text-display--line-height); }
.mlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.mcard { display: grid; gap: 10px; padding: 16px; border-radius: var(--radius-lg); background: var(--color-surface); border: var(--hairline) solid var(--color-border); color: inherit; text-decoration: none; }
.mcard:hover { border-color: var(--color-border-input); }
.mcard .trunc { max-width: 100%; font-weight: 600; }
.mission { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.mstats { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.mstats .stat { padding: 12px; }
.mstats .value { font-family: var(--font-mono); font-variant-numeric: tabular-nums slashed-zero; direction: ltr; unicode-bidi: isolate; }
.phase { display: grid; gap: 8px; padding: 8px; border-radius: var(--radius-lg); background: var(--color-surface); border: var(--hairline) solid var(--color-border); }
.phase > header { padding: 4px 8px 0; }
.phase h2 { font-size: var(--text-sm); font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
.msteps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.mstep { display: grid; gap: 8px; padding: 12px; border-radius: var(--radius-md); background: var(--color-surface-sunken); border: var(--hairline) solid var(--color-border); min-width: 0; }
.mstep.is-locked { border: 1px dashed var(--color-approval); }
.mstep-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.mstep-head > .row { grid-column: 1 / -1; }
.mstep .idx { display: grid; place-items: center; min-inline-size: 32px; block-size: 24px; padding-inline: 6px; border-radius: var(--radius-pill); background: var(--color-surface); font-size: var(--text-caption); }
.mstep .what { display: grid; min-width: 0; }
.mstep .what b { font-size: var(--text-sm); font-weight: 600; overflow-wrap: anywhere; }
.mstep .what span { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.mstep code { font-family: var(--font-mono); }
.gates { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.gates li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.gates code { font-family: var(--font-mono); overflow-wrap: anywhere; min-width: 0; }
.mlock { background: var(--color-surface); }
.sample-note.lock-note { color: var(--color-approval); }
.caps { list-style: none; margin: 0; padding: 0; display: grid; max-block-size: 420px; overflow-y: auto; }
.caps li { display: grid; gap: 6px; padding-block: 10px; border-block-end: var(--hairline) solid var(--color-border); }
.caps li:last-child { border-block-end: 0; }
.caps .what { display: grid; gap: 2px; min-width: 0; }
.caps .what b { font-size: var(--text-sm); font-weight: 600; }
.caps .mono, .hash { overflow-wrap: anywhere; direction: ltr; unicode-bidi: isolate; text-align: start; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; font-size: var(--text-sm); }
.kv dt { color: var(--color-text-muted); }
.kv dd { margin: 0; min-width: 0; }
@media (min-width: 1100px) { .mission { grid-template-columns: minmax(0, 1fr) 360px; } .mside { position: sticky; inset-block-start: 80px; } .mstep-head { grid-template-columns: auto minmax(0, 1fr) auto; } .mstep-head > .row { grid-column: auto; } }
@media (max-width: 480px) { .mstats { grid-template-columns: minmax(0, 1fr); } }
/* ── Local model (ADR-136) ──────────────────────────────── */
.llm-badge { text-decoration: none; flex: none; }
.think summary { cursor: pointer; font-size: var(--text-caption); color: var(--color-text-muted); padding-block: 4px; }
.think pre { white-space: pre-wrap; overflow-wrap: anywhere; max-block-size: 320px; overflow-y: auto; }
@media (max-width: 767px) { .llm-badge .llm-word { display: none; } .llm-badge { padding-inline: 8px; } }
@media (max-width: 480px) { .clone-row { grid-template-columns: minmax(0, 1fr); } .clone-row .btn { justify-self: start; } }
/* ── Workflows, analytics, webhooks, plans (ADR-137) ──────── */
.wf-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1100px) { .wf-layout { grid-template-columns: minmax(0, 1fr) 340px; } }
.wf-name { min-width: min(100%, 320px); flex: 1; }

.wf-canvas svg { display: block; }
.wf-node { cursor: grab; outline: none; }

/* ── Responsive shell ───────────────────────────────────── */
@media (min-width: 768px) and (max-width: 1279px) {

  .topbar .menu-btn { display: inline-flex; }

  main { padding: 16px 16px calc(48px + env(safe-area-inset-bottom)); gap: 20px; }

}
@media (pointer: coarse) {

}
@media (prefers-reduced-motion: reduce) {

}

/* Memory bank and Skill Forge (ADR-138) */

:root { --bg: #090b10; --surface: #10141b; --text: #eef2f8; --muted: #b9c1cd; --accent: #77bcff; --on-accent: #04101f; --border: #242b37; --r: 12px; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.6 "Inter Variable", "Readex Pro Variable", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
:lang(ar) body, body:lang(ar) { font-family: "Readex Pro Variable", "Inter Variable", Tahoma, system-ui, sans-serif; line-height: 1.75; letter-spacing: 0; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; }
:lang(ar) h1, :lang(ar) h2, :lang(ar) h3 { line-height: 1.45; }
p { text-wrap: pretty; }
a { color: var(--accent); }
.wrap { width: 100%; max-width: 1120px; margin-inline: auto; padding-inline: 20px; }
section { padding-block: 56px; border-block-end: 1px solid var(--border); }
.nav { position: sticky; inset-block-start: 0; z-index: 2; background: var(--bg); border-block-end: 1px solid var(--border); }
/* Liquid Glass on the sticky bar only (Jarvis: blur 16, saturate 180, about 78% opaque), solid without
   backdrop-filter support and under prefers-reduced-transparency. */
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .nav { background: color-mix(in oklab, var(--bg) 78%, transparent); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); box-shadow: inset 0 -1px 0 color-mix(in oklab, var(--text) 8%, transparent); }
}
@media (prefers-reduced-transparency: reduce) { .nav { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; } }
.nav .wrap { display: flex; align-items: center; gap: 16px; min-height: 60px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 18px; margin-inline-end: auto; }
.links { display: flex; gap: 16px; flex-wrap: wrap; list-style: none; margin: 0; padding: 0; }
.links a { color: var(--muted); text-decoration: none; font-size: 15px; }
.links a:hover { color: var(--text); }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding-inline: 18px; border-radius: var(--r); font-weight: 600; font-size: 15px; text-decoration: none; border: 1px solid transparent; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.ghost { color: var(--text); border-color: var(--border); }
.hero { padding-block: 72px; }
.kicker { color: var(--accent); font-weight: 600; font-size: 14px; margin-block-end: 12px; }
.hero h1 { font-size: clamp(32px, 6vw, 56px); max-width: 18ch; }
.hero p { margin-block: 16px 28px; color: var(--muted); font-size: 18px; max-width: 60ch; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; }
h2 { font-size: clamp(24px, 3.5vw, 34px); margin-block-end: 24px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
@media (min-width: 900px) { .grid.fixed { grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); } }
.table-wrap { overflow-x: auto; border-radius: var(--r); border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { padding: 12px 16px; text-align: start; border-block-end: 1px solid var(--border); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; background: var(--surface); }
tbody tr:last-child td { border-block-end: 0; }
.lead { color: var(--muted); font-size: 18px; max-width: 65ch; }
.card { padding: 20px; border-radius: calc(var(--r) + 8px); background: var(--surface); border: 1px solid var(--border); }
.card h3 { font-size: 18px; margin-block-end: 8px; }
.card p { color: var(--muted); font-size: 15px; }
.stats .grid { text-align: center; }
.stat b { display: block; font-family: "Geist Mono Variable", ui-monospace, monospace; font-size: clamp(28px, 5vw, 44px); color: var(--text); font-variant-numeric: tabular-nums slashed-zero; direction: ltr; unicode-bidi: isolate; }
td, th { font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 15px; }
details { padding: 16px 20px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--border); }
details + details { margin-block-start: 8px; }
summary { cursor: pointer; font-weight: 600; }
details p { margin-block-start: 8px; color: var(--muted); }
.cta { text-align: center; }
.cta p { color: var(--muted); margin-block: 8px 24px; }
.cta h2 { margin-block-end: 0; }
footer { padding-block: 32px; color: var(--muted); font-size: 14px; }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

 النتائج من ذاكرة هذا المتصفح.","No source answered, so these come from this workspace's memory.":"لم يُجب أي مصدر، لذا تأتي هذه من ذاكرة مساحة العمل هذه.","Write a full public address that starts with https://":"اكتب عنواناً عاماً كاملاً يبدأ بـ https://","Write at least two characters to search for.":"اكتب حرفين على الأقل للبحث.","Mode is web, packages or osv.":"الوضع هو web أو packages أو osv.","Name the workspace the search belongs to.":"سمِّ مساحة العمل التي يتبع لها البحث.","The API's free limit is used up for now; try again in a minute.":"استُنفد الحد المجاني للواجهة الآن؛ حاول بعد دقيقة.","Reading an address needs the local server. Start it with: node jarvis/server/server.mjs, then open http://127.0.0.1:8798. Or paste the HTML.":"قراءة عنوان تحتاج الخادم المحلي. شغّله بالأمر: node jarvis/server/server.mjs ثم افتح http://127.0.0.1:8798. أو الصق الـ HTML."}},"evidence":[{"path":"jarvis/app/data/skills-scan.json","check":"security","ok":true,"detail":"critical 0, high 0, 113 files","sha256":"7502aa2e6ea9a505","savedAt":null},{"path":"jarvis/replica/design/contrast-report.txt","check":"contrast","ok":true,"detail":"118 checks, 0 failing","sha256":"1d9b4541e501207d","savedAt":null},{"path":"jarvis/replica/evidence/tests-server.log","check":"tests","ok":true,"detail":"414 passed, 0 failed","sha256":"760035505eb5d539","savedAt":null},{"path":"jarvis/replica/evidence/tests-app.log","check":"tests","ok":true,"detail":"111 passed, 0 failed","sha256":"bbfc422fd5417fa8","savedAt":null},{"path":"jarvis/replica/evidence/tests-live.log","check":"tests","ok":true,"detail":"77 passed, 0 failed","sha256":"0ca18dc875222c70","savedAt":null},{"path":"jarvis/replica/evidence/tests-long-horizon.log","check":"tests","ok":true,"detail":"Ran 10 tests, OK","sha256":"74545a762b035426","savedAt":null},{"path":"jarvis/replica/evidence/lint-long-horizon.log","check":"lint","ok":true,"detail":"clean","sha256":"82b3e6a6c090a576","savedAt":null}]}</script>
<script>
// Jarvis app (ADR-133). One static page: hash router, an in-page data layer with the same
// function names as the phase 2 API (jarvis/replica/architecture.md), and no network
// (CSP connect-src 'none'). Text goes in with textContent only; no innerHTML, no eval.
(() => {
  "use strict";

  /* ── Data from the build: skills snapshot, SkillSpector rules, preview hashes ── */
  const DATA = (() => {
    try { return JSON.parse(document.getElementById("jarvis-data").textContent); }

  })();
  // SkillSpector's rule set, inlined by the build between the scanner's data markers.
  const SPECTOR_RULES = /* SKILLSPECTOR_RULES_START */[{"id":"SEC-KEY-LITERAL","sev":"critical","re":"(sk-(?:ant-|proj-)?[A-Za-z0-9_-]{20,}|gsk_[A-Za-z0-9]{40,}|csk-[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{35}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{60,}|xox[abprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----)","flags":"","files":"*","msg":"Secret-shaped literal in a file. Move it to the encrypted vault or an env file outside the repo."},{"id":"SEC-PIPE-SHELL","sev":"critical","re":"(curl|wget)[^\\n|]*\\|\\s*(sudo\\s+)?(ba|z)?sh\\b|iwr[^\\n|]*\\|\\s*iex|Invoke-Expression","flags":"i","files":"*","msg":"Downloads and runs code in one step. Review the script and pin it by hash instead."},{"id":"SEC-EVAL","sev":"high","re":"(^|[^\\w.$])eval\\s*\\(|new\\s+Function\\s*\\(|(setTimeout|setInterval)\\s*\\(\\s*[\"'`]","flags":"","files":"code","msg":"Runs a string as code. Replace with a direct function call."},{"id":"SEC-EXEC","sev":"high","re":"child_process|\\bexecSync\\s*\\(|\\bspawnSync\\s*\\(|\\bos\\.system\\s*\\(|\\bsubprocess\\.(run|Popen|call|check_output)\\s*\\(|Runtime\\.getRuntime\\(\\)\\.exec","flags":"","files":"code","msg":"Starts a process. Inside a skill or plugin this needs a manual review."},{"id":"SEC-XSS-SINK","sev":"high","re":"\\.(innerHTML|outerHTML)\\s*=(?!=)|insertAdjacentHTML\\s*\\(|document\\.write(ln)?\\s*\\(|dangerouslySetInnerHTML","flags":"","files":"code","msg":"Writes markup from a string (XSS sink). Use textContent or build nodes."},{"id":"SEC-INLINE-HANDLER","sev":"medium","re":"\u003c[a-z][^>]*\\son(click|load|error|mouseover|focus|submit|change|input|keydown|keyup)\\s*=","flags":"i","files":"html","msg":"Inline event handler. A strict CSP blocks it; attach with addEventListener."},{"id":"SEC-ENV","sev":"medium","re":"process\\.env\\b|\\bos\\.environ\\b|\\bos\\.getenv\\s*\\(|Deno\\.env","flags":"","files":"code","msg":"Reads environment variables (where API keys usually live)."},{"id":"SEC-STORAGE","sev":"medium","re":"\\b(localStorage|sessionStorage|indexedDB)\\b","flags":"","files":"code","msg":"Uses browser storage. Secrets there must be encrypted (AES-GCM vault)."},{"id":"SEC-HTTP","sev":"medium","re":"http://(?!127\\.0\\.0\\.1|localhost|0\\.0\\.0\\.0|\\[::1\\]|www\\.w3\\.org|schemas\\.|purl\\.org|ns\\.adobe\\.com)[a-z0-9.-]+","flags":"i","files":"*","msg":"Plain http:// to an outside host. Use https://."},{"id":"SEC-HOST","sev":"low","re":"https://([a-z0-9-]+\\.)+[a-z]{2,}","flags":"gi","files":"code","msg":"Outside host not in the allowlist (.skillspector.json allowHosts)."},{"id":"SEC-BLANK-REL","sev":"low","re":"\u003ca\\b(?=[^>]*target=\"_blank\")(?![^>]*rel=\"[^\"]*noopener)[^>]*>","flags":"gi","files":"html","msg":"target=_blank without rel=\"noopener noreferrer\" (auto-fixable)."},{"id":"SEC-SRI","sev":"high","re":"\u003cscript\\b(?=[^>]*\\ssrc=\"https?://)(?![^>]*\\sintegrity=)[^>]*>|\u003clink\\b(?=[^>]*rel=\"stylesheet\")(?=[^>]*href=\"https?://)(?![^>]*\\sintegrity=)[^>]*>","flags":"gi","files":"html","msg":"External script or stylesheet without Subresource Integrity (auto-fixable with --fetch)."},{"id":"SEC-PROMPT-INJECTION","sev":"high","re":"ignore (all )?(previous|prior|above) instructions|disregard (the )?(system|previous) prompt|--dangerously-skip-permissions|bypassPermissions|\"defaultMode\"\\s*:\\s*\"bypass","flags":"i","files":"agent","msg":"Instruction-override phrase or permission bypass inside an agent/skill file."}]/* SKILLSPECTOR_RULES_END */;

  /* ── Small helpers ─────────────────────────────────────────── */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

  function h(tag, props, ...kids) {
    const n = document.createElement(tag);

      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k === "dataset") Object.assign(n.dataset, v);
      else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
      else if (PROPS.has(k)) n[k] = v;

  const fmtN = new Intl.NumberFormat("en");
  // Dates follow the interface language (Arabic with Latin digits, like every number in Jarvis).
  let rel = new Intl.RelativeTimeFormat("en", { numeric: "auto" });

    if (a < 3600) return rel.format(Math.round(s / 60), "minute");

  const plural = (n, word) => fmtN.format(n) + " " + word + (n === 1 ? "" : "s");
  const dur = ms => (ms == null ? "—" : ms < 1000 ? fmtN.format(ms) + " ms" : (ms / 1000).toFixed(1) + " s");

  /* ── Data layer (phase 1: in-page sample data; phase 2 swaps in /api with the same names) ── */
  const LOCKED = { money: "moves money", publish: "publishes to an outside domain", permissions: "changes repository permissions", install: "installs a skill into the repo", outbound: "sends a message outside" };
  const TOOL_LIST = ["files.read", "notes.read", "notes.write", "runs.read", "git.log", "web.read"];
  const WORKSPACES = [["omega-prime", "OMEGA PRIME"], ["jarvis-studio", "Jarvis Studio"], ["giant-core", "giant-core"]];

  // Shared validation (the server runs the same rules and has the final say).
  function validateAgentInput(input, existing, exceptId) {
    const errs = {};
    const name = String(input.name || "").trim();
    if (!name) errs.name = "Give the agent a name.";
    else if (name.length > 60) errs.name = "Use 60 characters or fewer.";
    else if (existing.some(a => a.id !== exceptId && a.name.toLowerCase() === name.toLowerCase())) errs.name = "Another agent already has this name.";
    if (String(input.rolePrompt || "").length > 2000) errs.rolePrompt = "Keep the role under 2,000 characters.";
    const ms = Number(input.maxSteps);
    if (!Number.isInteger(ms) || ms < 1 || ms > 200) errs.maxSteps = "Enter a whole number from 1 to 200.";
    if (input.mode !== undefined && !["single", "long_horizon"].includes(input.mode)) errs.mode = "Pick single run or long-horizon mission.";
    const ce = input.capsuleEvery === undefined ? 1 : Number(input.capsuleEvery);
    if (!Number.isInteger(ce) || ce < 1 || ce > 10) errs.capsuleEvery = "Enter a whole number from 1 to 10.";
    return errs;
  }
  const permsOf = tools => ({ writeNotes: tools.includes("notes.write"), readWeb: tools.includes("web.read") });

  /* ── Missions (ADR-135): shared helpers for both stores ─────── */
  // SHA-256 in plain JS (FIPS 180-4), so capsules hash the same way from file:// and from the server.
  const sha256hex = (() => {
    const K = [], H0 = [], primes = [];
    for (let n = 2; primes.length < 64; n++) if (primes.every(p => n % p)) primes.push(n);
    const frac = x => ((x - Math.floor(x)) * 0x100000000) >>> 0;
    primes.forEach((p, i) => { K[i] = frac(Math.cbrt(p)); if (i < 8) H0[i] = frac(Math.sqrt(p)); });
    const rotr = (x, n) => (x >>> n) | (x << (32 - n));
    return str => {
      const bytes = new TextEncoder().encode(str);
      const l = bytes.length, n = ((l + 9 + 63) >> 6) << 6;
      const m = new Uint8Array(n);
      m.set(bytes); m[l] = 0x80;
      const dv = new DataView(m.buffer);
      dv.setUint32(n - 4, (l * 8) >>> 0); dv.setUint32(n - 8, Math.floor(l / 0x20000000));
      const H = H0.slice(), W = new Uint32Array(64);
      for (let o = 0; o < n; o += 64) {
        for (let i = 0; i < 16; i++) W[i] = dv.getUint32(o + i * 4);
        for (let i = 16; i < 64; i++) {
          const s0 = rotr(W[i - 15], 7) ^ rotr(W[i - 15], 18) ^ (W[i - 15] >>> 3), s1 = rotr(W[i - 2], 17) ^ rotr(W[i - 2], 19) ^ (W[i - 2] >>> 10);
          W[i] = (W[i - 16] + s0 + W[i - 7] + s1) >>> 0;
        }
        let [a, b, c, d, e, f, g, hh] = H;
        for (let i = 0; i < 64; i++) {
          const t1 = (hh + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) >>> 0;
          const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
          hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
        }
        [a, b, c, d, e, f, g, hh].forEach((v, i) => { H[i] = (H[i] + v) >>> 0; });
      }
      return H.map(x => x.toString(16).padStart(8, "0")).join("");
    };
  })();
  // Keys sorted at every level, no spaces: the same canonical form as the server and lhcommon.py.
  const canonical = v => Array.isArray(v) ? "[" + v.map(canonical).join(",") + "]"
    : v && typeof v === "object" ? "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + canonical(v[k])).join(",") + "}"
    : JSON.stringify(v === undefined ? null : v);
  const ZERO64 = "0".repeat(64);
  const sealCapsule = c => sha256hex(canonical({ mission_id: c.mission_id, seq: c.seq, label: c.label, state: c.state, prev_hash: c.prev_hash, created_at: c.created_at }));
  function verifyChain(list, missionId) {
    const problems = [];
    let prev = ZERO64;
    list.forEach((c, i) => {
      if (c.seq !== i + 1) problems.push("#" + c.seq + ": sequence gap");
      if (c.prevHash !== prev) problems.push("#" + c.seq + ": prev_hash does not match the capsule before it");
      if (sealCapsule({ mission_id: missionId, seq: c.seq, label: c.label, state: c.state, prev_hash: c.prevHash, created_at: new Date(c.createdAt).toISOString() }) !== c.hash) problems.push("#" + c.seq + ": hash does not match its content");
      prev = c.hash;
    });
    return { ok: !problems.length, count: list.length, problems, head: list.length ? list[list.length - 1].hash : ZERO64 };
  }
  const HEALTH_BASIS = "[INFERENCE] fixed rule: 100 − 12 per step since the last capsule − 1 per 400 output tokens over 4,000 (tokens ≈ bytes ÷ 4).";
  function missionHealth(m) {
    const last = m.capsules[m.capsules.length - 1];
    const lastAt = last ? last.createdAt : null;
    const since = m.steps.filter(s => s.updatedAt && (lastAt == null || s.updatedAt > lastAt) && ["done", "failed", "skipped", "blocked"].includes(s.status)).length;
    const tokens = Math.round(m.steps.reduce((n, s) => n + (s.output ? JSON.stringify(s.output).length : 0), 0) / 4);
    const score = Math.max(0, Math.min(100, 100 - since * 12 - Math.max(0, Math.round((tokens - 4000) / 400))));
    return { score, label: score >= 70 ? "good" : score >= 40 ? "save a capsule soon" : "save a capsule now", stepsSinceCapsule: since, outputTokens: tokens, capsules: m.capsules.length, basis: HEALTH_BASIS };
  }
  const GATE_LABEL = { tests: "TDD", lint: "Lint", contrast: "Contrast", security: "Security" };
  const MISSION_TOOLS = ["files.read", "git.log", "notes.read", "runs.read"];
  // The long-horizon mode of an agent: its read tools in phase 1, a security gate, then the note approval.
  function agentMissionTemplate(a) {
    const steps = a.tools.filter(t => MISSION_TOOLS.includes(t)).map(t => ({ phase: 1, kind: "tool", title: "Run " + t, tool: t }));
    const reads = steps.map((_, i) => i);

    if (a.tools.includes("notes.write")) steps.push({ phase: 3, kind: "approval", title: "Save the mission note", category: "file_write", depends: [...reads, steps.length - 1] });
    return { title: a.name + " · long run", goal: a.rolePrompt || "Run this agent's tools with gates and capsules.", steps };
  }

  /* Sample store: opened from disk (file://). Labelled sample data, simulated runs, three workspaces. */
  function sampleStore() {
    const uid = p => p + "_" + Math.random().toString(36).slice(2, 9);
    let db, failMode = false;
    const subs = new Set();
    const MIN = 60000;
    function ev(actor, kind, target, at) { return { id: uid("ev"), actor, kind, target, at: at || Date.now() }; }
    function mkSteps(tools, status, n) { return tools.slice(0, n == null ? tools.length : n + 1).map((tool, i) => ({ idx: i, tool, status, ms: 400 + i * 350, tries: 1 })); }
    const agent = (id, name, model, rolePrompt, tools, maxSteps, status, createdAt, skills) => ({ id, name, model, rolePrompt, tools, skills: skills || [], maxSteps, permissions: permsOf(tools), status, createdAt, mode: "single", capsuleEvery: 1 });
    function seedPrime(t) {
      const agents = [
        agent("ag_research", "Research assistant", "Local model (loopback)", "Reads public pages on a topic and writes a short, sourced summary. Never acts outside the project folder.", ["web.read", "notes.write"], 20, "idle", t - 9 * 86400000, ["omega-deep-research-agent"]),
        agent("ag_inbox", "Inbox triage", "Local model (loopback)", "Sorts incoming notes into topics. Drafts replies but never sends them.", ["notes.read", "notes.write"], 12, "idle", t - 7 * 86400000),
        agent("ag_weekly", "Weekly report", "Local model (loopback)", "Collects the week's runs and writes a plain summary for Director 00.", ["runs.read", "notes.write"], 15, "idle", t - 5 * 86400000),
        agent("ag_docs", "Docs indexer", "Local model (loopback)", "Builds a searchable index of the docs folder.", ["files.read"], 30, "failed", t - 3 * 86400000),

const WF_TOOLS = ["files.read", "git.log", "notes.read", "runs.read"];

// Kinds: tool (a read tool), gate (a check on saved evidence), approval (a person decides),
// note (a note written after approval). Levels come from a topological sort (Kahn); a cycle is refused.
function checkGraph(raw) {

    if (!title) bad("Step " + (i + 1) + " needs a title.");

function normalize(text) {

function bm25(docs, query, { k1 = 1.2, b = 0.75, limit = 10 } = {}) {

const cleanText = (s, n) => String(s || "").replace(/[\u0000-\u001f\u007f]/g, " ").replace(/\s+/g, " ").trim().slice(0, n);

function forgeSkill({ name, description, kind = "checklist", steps = [] }) {

---

${d}

      b.title = st.online ? "Local models on 127.0.0.1: " + st.models.join(", ") : "No local model: plans and designs use the fixed rules";
    }, () => {});
    store.subscribe(updateCount);
    buildWsMenu();
    updateCount();
    route();
  });
})();

</script>
</body>
</html>
