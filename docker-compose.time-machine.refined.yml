version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: omega-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omega_prime
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/time-machine/migrations/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omega-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  quantreplay:
    image: quay.io/quodfinancial/quantreplay:1.0.0
    container_name: omega-quantreplay
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      QUANTREPLAY_PORT: 8080
      QUANTREPLAY_ENV: production
      QUANTREPLAY_LOG_LEVEL: info
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: omega_prime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  canwu:
    build:
      context: ./services/time-machine/canwu
      dockerfile: Dockerfile
    container_name: omega-canwu
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CANWU_HOST: 0.0.0.0
      CANWU_PORT: 8081
      RUST_LOG: info
      REDIS_URL: redis://redis:6379
      TIME_MACHINE_COMMAND_STREAM: omega:simulation:commands
      TIME_MACHINE_RESULT_STREAM: omega:simulation:results
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/omega_prime
      WORKER_THREADS: 4
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  time-machine-agent:
    build:
      context: ./services/time-machine
      dockerfile: Dockerfile.agent
    container_name: omega-time-machine-agent
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      quantreplay:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: omega_prime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TIME_MACHINE_COMMAND_STREAM: omega:simulation:commands
      TIME_MACHINE_RESULT_STREAM: omega:simulation:results
      LOG_LEVEL: info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import redis; redis.Redis(host='redis', port=6379).ping()"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: omega-network
